<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a120c">
  <meta name="description" content="카페 메뉴">
  <title>CAFE · MENU</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== 스크롤 연동 히어로 =====
       사진 교체: assets/hero.jpg 파일만 바꾸면 됩니다.
       (세로로 긴 사진일수록 잘 어울림 / 권장 1600x2000 이상)
       움직임 길이 조절: css/style.css 의 --hero-scroll 값
  -->
  <header class="hero">
    <div class="hero__stage">
      <div class="hero__media">
        <img class="hero__img" src="assets/hero.svg" alt="" fetchpriority="high">
      </div>
      <div class="hero__scrim"></div>

      <div class="hero__copy">
        <h1 class="hero__name" id="cafe-name">CAFE NAME</h1>
        <p class="hero__tagline" id="cafe-tagline">Roastery &amp; Dessert</p>
      </div>

      <div class="hero__cue" aria-hidden="true">SCROLL</div>
    </div>
  </header>

  <!-- ===== 메뉴 (js/menu-data.js 내용으로 자동 생성) ===== -->
  <main class="menu">
    <div class="wrap" id="menu-root"></div>

    <footer class="foot">
      <div class="wrap">
        <div class="foot__name" id="foot-name">CAFE NAME</div>
        <div id="foot-address"></div>
        <div id="foot-hours"></div>
        <div id="foot-phone"></div>
        <div><a id="foot-instagram" href="#" target="_blank" rel="noopener"></a></div>
        <p id="foot-notice" style="white-space:pre-line; margin-top:18px; font-size:.75rem;"></p>
      </div>
    </footer>
  </main>

  <script src="js/menu-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
